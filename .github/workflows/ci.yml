name: Backend CI & CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Typecheck with Mypy
        run: uv run mypy app

      - name: Run Pytest suite
        run: uv run pytest -v

      - name: Verify OpenAPI schema export
        run: uv run python scripts/export_openapi.py --output openapi.json

  deploy-production:
    needs: [quality-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npm install -g vercel@latest
            vercel pull --yes --environment=production
            vercel deploy --prod --yes
          elif [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Vercel production deployment via Deploy Hook..."
            curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "::error::Neither VERCEL_TOKEN nor VERCEL_DEPLOY_HOOK_URL secret is configured."
            exit 1
          fi
